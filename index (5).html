<!DOCTYPE html>
<html lang="tr">
<head>

<title>Dijital Kartvizit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111110'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23F4F3EF' stroke-width='6' stroke-dasharray='89.7 106.8' transform='rotate(-16 32 32)'/%3E%3Ccircle cx='32' cy='32' r='4.5' fill='%23F4F3EF'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Kufi+Arabic:wght@400..700&display=swap" rel="stylesheet">
<style>
  /* ============ Vorzen · kartvizit ============ */
  :root{
    --bg:#ECEBE7; --surface:#FFFFFF; --ink:#111110; --ink-2:#3B3A37; --muted:#7A7872; --line:#DAD8D2; --press:#F1F0EC;
    --inv:#111110; --inv-ink:#F4F3EF; --edge:#C9C7C1;
    --sh-a:rgba(25,22,18,.20); --sh-c:rgba(25,22,18,.28);
    --font:"Archivo","Noto Kufi Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
    --cw:min(68vw,290px);
    --px:0px; --py:0px; --sx:50%; --so:0;
  }
  .dark{
    --bg:#0F0F0E; --surface:#1A1A19; --ink:#F1F0EC; --ink-2:#CFCDC7; --muted:#8E8C86; --line:#2C2C2A; --press:#222221;
    --inv:#F1F0EC; --inv-ink:#111110; --edge:#2E2E2C;
    --sh-a:rgba(0,0,0,.6); --sh-c:rgba(0,0,0,.7);
  }
  @supports (height:100svh){:root{--cw:min(68vw,290px,max(220px,calc((100svh - 320px) * .631)))}}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{min-height:100svh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  svg{display:block}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
  main{max-width:460px;margin:0 auto;padding:0 20px}

  /* ---------- brand mark: the open O with its dot ---------- */
  .mk{width:24px;height:24px;color:var(--ink);flex:0 0 auto}
  .mk-s{width:14px;height:14px}

  /* ---------- loader ---------- */
  .loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .loader::before{content:"";position:absolute;inset:0;background:var(--bg);transition:opacity .55s ease .05s}
  .loader > *{position:relative}
  .loader .mk{width:58px;height:58px;transition:transform .6s var(--ease),opacity .4s ease}
  .gone .loader .mk{transform:scale(.6);opacity:0}
  .loader .ring{stroke-dashoffset:121.4;animation:draw .85s cubic-bezier(.65,0,.25,1) .1s forwards}
  .loader .dotc{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .55s cubic-bezier(.3,1.7,.5,1) .7s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{to{transform:scale(1)}}
  .lbar{width:58px;height:3px;margin-top:26px;background:var(--line);overflow:hidden}
  .lbar i{display:block;height:100%;width:0;background:var(--ink);transition:width .55s var(--ease)}
  .who{margin-top:16px;font-size:13px;color:var(--muted);opacity:0;animation:fadein .6s ease .45s forwards;max-width:80vw;text-align:center}
  @keyframes fadein{to{opacity:1}}
  .gone .loader{pointer-events:none}
  .gone .loader::before{opacity:0}
  .gone .loader .lbar,.gone .loader .who{opacity:0;animation:none;transition:opacity .15s}

  /* ---------- header ---------- */
  .hd{display:flex;align-items:center;justify-content:space-between;height:60px;padding-top:env(safe-area-inset-top);box-sizing:content-box}
  .brand{display:flex;align-items:center;gap:10px;height:42px}
  .brand .logo{height:17px;width:94px;display:block;color:var(--ink)}
  .brand .fb{display:flex;align-items:center;gap:10px}
  .bw{font-size:12px;font-weight:650;font-stretch:125%;letter-spacing:.06em}
  .icb{width:42px;height:42px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;transition:transform .15s}
  .icb svg{width:19px;height:19px}
  .icb .sun{display:none} .dark .icb .sun{display:block} .dark .icb .moon{display:none}
  .icb:active{transform:scale(.94)}

  /* ---------- hero ---------- */
  .hero{position:relative;margin:6px -8px 0}
  .pic{position:relative;aspect-ratio:4/5;max-height:64svh;width:100%;border-radius:26px;overflow:hidden;background:#D6D4CE}
  .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.07);transition:transform 1.6s var(--ease)}
  .shown .pic img{transform:none}
  .pic.logo{background:var(--surface);display:grid;place-items:center}
  .pic.logo img{position:static;width:auto;height:auto;max-width:56%;max-height:46%;object-fit:contain}
  .dark .pic.logo{background:#F4F3EF}
  .pic.mono{background:var(--inv);color:var(--inv-ink)}
  .pic.mono span{position:absolute;left:18px;bottom:-.12em;font-size:min(52vw,230px);line-height:1;font-weight:800;font-stretch:125%;letter-spacing:-.045em;white-space:nowrap}
  .tab{position:absolute;left:0;bottom:-1px;max-width:86%;background:var(--bg);padding:16px 22px 2px 8px;border-top-right-radius:26px;
    transform:translateY(16px);opacity:0;transition:transform .9s var(--ease) .15s,opacity .6s ease .15s}
  .shown .tab{transform:none;opacity:1}
  .tab::before,.tab::after{content:"";position:absolute;width:26px;height:26px;background:radial-gradient(circle at 100% 0,transparent 25.5px,var(--bg) 26px)}
  .tab::before{left:0;top:-26px}
  .tab::after{right:-26px;bottom:1px}
  .ar .tab{left:auto;right:0;padding:16px 8px 2px 22px;border-top-right-radius:0;border-top-left-radius:26px}
  .ar .tab::before{left:auto;right:0;background:radial-gradient(circle at 0 0,transparent 25.5px,var(--bg) 26px)}
  .ar .tab::after{right:auto;left:-26px;background:radial-gradient(circle at 0 0,transparent 25.5px,var(--bg) 26px)}
  .ar .pic.mono span{left:auto;right:18px}
  .nm{font-weight:700;font-stretch:110%;font-size:clamp(27px,8.4vw,36px);line-height:1.02;letter-spacing:-.02em}
  .nm[dir=rtl],.ar .nm{line-height:1.35}
  .role{margin-top:10px;font-size:15px;color:var(--muted);line-height:1.45}
  .id{padding:0 0 0 0}

  .fbar{display:inline-block;width:14px;height:3px;background:var(--ink);flex:0 0 auto}
  /* ---------- content ---------- */
  .rv{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .8s var(--ease);transition-delay:calc(var(--i,0) * 60ms + .15s)}
  .shown .rv{opacity:1;transform:none}
  .about{margin-top:22px;font-size:15.5px;line-height:1.6;color:var(--ink-2)}
  .about[lang=ar]{line-height:1.9}
  .blk{margin-top:30px}
  .blk h2{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:650;font-stretch:125%;letter-spacing:.07em;text-transform:uppercase;margin:0 0 12px}
  .rows{list-style:none;background:var(--surface);border-radius:16px;overflow:hidden}
  .row{position:relative;display:grid;grid-template-columns:86px 1fr 18px;align-items:center;gap:12px;min-height:58px;padding:0 16px;transition:background .2s}
  li + li .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
  .row:active{background:var(--press)}
  .row .k{font-size:13px;color:var(--muted)}
  .row .v{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
  .row .v[dir=auto]{direction:auto;text-align:start}
  .go{width:16px;height:16px;color:var(--muted)}
  .strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .so{position:relative;flex:0 0 128px;height:128px;scroll-snap-align:start;background:var(--surface);border-radius:16px;padding:14px;
    display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
  .strip.fill .so{flex:1 1 0}
  .so:active{transform:scale(.97)}
  .so .gl{width:24px;height:24px}
  .so .n{font-size:14px;font-weight:600;line-height:1.2}
  .so .h{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .so .go{position:absolute;top:14px;right:14px}
  .pay{background:var(--surface);border-radius:16px;padding:18px 16px 16px}
  .py-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .bank{font-size:15px;font-weight:650}
  .tag{font-size:10px;font-weight:650;font-stretch:125%;letter-spacing:.07em;padding:4px 7px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
  .ibn{margin-top:14px;font-size:clamp(13.5px,4.15vw,17px);font-weight:600;letter-spacing:0;word-spacing:.08em;white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr;text-align:left;line-height:1.35}
  .hold{margin-top:10px;display:flex;gap:10px;font-size:14px;align-items:baseline}
  .hold .k{color:var(--muted);font-size:13px;flex:0 0 auto}
  .py-act{display:flex;gap:8px;margin-top:16px}
  .cp{flex:1;height:48px;border-radius:12px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
  .cp svg{width:17px;height:17px}
  .cp.pri{background:var(--inv);color:var(--inv-ink)}
  .cp.sec{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
  .cp:active{transform:scale(.96)}
  .cp .ok{display:none} .cp.done .ok{display:block} .cp.done .ic{display:none}
  footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:40px;padding:18px 0 4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  footer .l{display:flex;align-items:center;gap:8px}
  footer .l .mk-s{color:var(--muted)}
  footer .logo{height:11px;width:61px;color:var(--muted)}
  footer a{color:var(--ink);font-weight:550;display:flex;align-items:center;gap:6px}
  footer a svg{width:13px;height:13px}

  /* ---------- action bar ---------- */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .7s var(--ease) .25s}
  .shown .bar{transform:none}
  .bar .in{max-width:460px;margin:0 auto;display:flex;gap:8px}
  .ib{flex:0 0 54px;height:54px;border-radius:13px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;transition:transform .15s}
  .ib svg{width:21px;height:21px}
  .save{flex:1;height:54px;border-radius:13px;background:var(--inv);color:var(--inv-ink);font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
  .save svg{width:19px;height:19px}
  .save .ok{display:none}
  .save.done .ok{display:block}
  .save.done .add{display:none}
  .act{flex:1;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:600;transition:transform .15s}
  .act svg{width:20px;height:20px}
  .act.pri{background:var(--inv);color:var(--inv-ink)}
  .act.sec{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
  .act:active{transform:scale(.96)}

  #vz-toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);opacity:0;z-index:120;
    background:var(--inv);color:var(--inv-ink);font:500 13px var(--font);padding:10px 14px;border-radius:10px;transition:.45s var(--ease)}
  #vz-toast.on{transform:translate(-50%,0);opacity:1}
  .empty{text-align:center;padding-top:40vh;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;animation-delay:0s!important;transition-delay:0s!important}}
</style>
</head>

const buzz = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wait = ms => new Promise(r => setTimeout(r, ms));
const T0 = performance.now();
const HTML = document.documentElement;
function setTheme(dark, save) {
  HTML.classList.toggle('dark', dark);
  document.getElementById('tc').content = dark ? '#0F0F0E' : '#ECEBE7';
  if (save) try { localStorage.setItem('vz-theme', dark ? 'd' : 'l'); } catch {}
}
let savedTheme = null; try { savedTheme = localStorage.getItem('vz-theme'); } catch {}
setTheme(savedTheme ? savedTheme === 'd' : g('th') === 'd', false);
const body = document.body.classList;
const app = document.getElementById('app');

if (!D.name) {
  document.getElementById('loader').remove(); body.remove('pre');
  app.innerHTML = '<p class="empty">Kartvizit bulunamadı.</p>';
} else {
  document.getElementById('who').textContent = D.name;
  const ar = isAr(D.name);
  const kind = D.img ? (D.isLogo ? 'logo' : 'photo') : 'mono';
  const pic = k => k === 'photo' ? `<div class="pic" id="pic"><img id="cimg" src="${esc(D.img)}" alt="${esc(D.name)}" decoding="async"></div>`
    : k === 'logo' ? `<div class="pic logo" id="pic"><img id="cimg" src="${esc(D.img)}" alt="${esc(D.name)}" decoding="async"></div>`
    : `<div class="pic mono" id="pic"><span dir="auto">${esc(D.initials)}</span></div>`;
  const brandFallback = `<span class="fb">${MARK}<span class="bw">VORZEN</span></span>`;
  const logoTag = () => `<svg class="logo" viewBox="-8 -4 265 48" role="img" aria-label="Vorzen" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="miter" stroke-miterlimit="2" stroke-linecap="butt"><polyline points="0.00,0.00 15.00,40.00 30.00,0.00"/><polyline points="-5.00,0.00 8.00,0.00"/><polyline points="22.00,0.00 35.00,0.00"/><polyline points="71.99,10.00 72.77,12.08 73.37,14.26 73.77,16.53 73.97,18.84 73.97,21.16 73.77,23.47 73.37,25.74 72.77,27.92 71.99,30.00 71.03,31.94 69.91,33.72 68.64,35.32 67.24,36.71 65.73,37.87 64.13,38.79 62.46,39.46 60.74,39.86 59.00,40.00 57.26,39.86 55.54,39.46 53.87,38.79 52.27,37.87 50.76,36.71 49.36,35.32 48.09,33.72 46.97,31.94 46.01,30.00 45.23,27.92 44.63,25.74 44.23,23.47 44.03,21.16 44.03,18.84 44.23,16.53 44.63,14.26 45.23,12.08 46.01,10.00 46.97,8.06 48.09,6.28 49.36,4.68 50.76,3.29 52.27,2.13 53.87,1.21 55.54,0.54 57.26,0.14 59.00,0.00 60.74,0.14 62.46,0.54 64.13,1.21"/><polyline points="90.00,40.00 90.00,0.00 105.00,0.00 105.69,0.02 106.37,0.09 107.05,0.20 107.72,0.36 108.38,0.56 109.02,0.80 109.64,1.08 110.25,1.41 110.83,1.77 111.39,2.17 111.92,2.61 112.42,3.08 112.89,3.58 113.33,4.11 113.73,4.67 114.09,5.25 114.42,5.86 114.70,6.48 114.94,7.12 115.14,7.78 115.30,8.45 115.41,9.13 115.48,9.81 115.50,10.50 115.48,11.19 115.41,11.87 115.30,12.55 115.14,13.22 114.94,13.88 114.70,14.52 114.42,15.14 114.09,15.75 113.73,16.33 113.33,16.89 112.89,17.42 112.42,17.92 111.92,18.39 111.39,18.83 110.83,19.23 110.25,19.59 109.64,19.92 109.02,20.20 108.38,20.44 107.72,20.64 107.05,20.80 106.37,20.91 105.69,20.98 105.00,21.00 90.00,21.00"/><polyline points="103.00,21.00 117.00,40.00"/><polyline points="84.00,40.00 98.00,40.00"/><polyline points="110.00,40.00 121.00,40.00"/><polyline points="84.00,0.00 90.00,0.00"/><polyline points="133.00,0.00 161.00,0.00 133.00,40.00 161.00,40.00"/><polyline points="133.00,0.00 133.00,8.00"/><polyline points="161.00,40.00 161.00,32.00"/><polyline points="205.00,0.00 178.00,0.00 178.00,40.00 205.00,40.00"/><polyline points="174.00,0.00 178.00,0.00"/><polyline points="174.00,40.00 178.00,40.00"/><polyline points="205.00,0.00 205.00,8.00"/><polyline points="205.00,40.00 205.00,32.00"/><polyline points="222.00,40.00 222.00,0.00 248.00,40.00 248.00,0.00"/><polyline points="216.00,40.00 228.00,40.00"/><polyline points="242.00,0.00 254.00,0.00"/><polyline points="216.00,0.00 222.00,0.00"/><polyline points="186.00,20.00 201.00,20.00"/></g><circle cx="68.64" cy="4.68" r="2.6" fill="currentColor"/></svg>`;

  const rows = D.contacts.map(c => `<li><a class="row" href="${esc(c.href)}"${ext(c.href)}>
      <span class="k">${KEY[c.k]}</span>
      <span class="v"${c.k === 'm' ? ' dir="auto"' : ''}>${esc(c.shown)}</span>
      ${I(IC.arrow).replace('<svg', '<svg class="go"')}</a></li>`).join('');
  const socials = D.socials.map(s => `<a class="so" href="${esc(s.href)}" target="_blank" rel="noopener">
      <span class="gl">${s.icon}</span>${I(IC.arrow).replace('<svg', '<svg class="go"')}
      <span><span class="n">${s.label}</span><span class="h">${esc(s.shown)}</span></span></a>`).join('');
  const IBAN = g('ib').replace(/\s+/g, '').toUpperCase(), BANK = g('bk'), HOLD = g('ah');
  const cpBtn = (cls, val, label) => `<button class="cp ${cls}" data-c="${esc(val)}" data-l="${label}"><span class="ic">${I(IC.copy)}</span><span class="ok">${I(IC.ok, 2)}</span><span class="t">${label}</span></button>`;
  let payHTML = '';
  let i = 0;
  if (IBAN) payHTML = `<section class="blk rv" style="--i:__PI__"><h2><span class="fbar"></span>Ödeme bilgileri</h2><div class="pay">
      <div class="py-top"><span class="bank" dir="auto">${esc(BANK || 'Banka hesabı')}</span><span class="tag">IBAN</span></div>
      <div class="ibn">${esc(IBAN.replace(/(.{4})/g, '$1 ').trim())}</div>
      ${HOLD ? `<div class="hold"><span class="k">Alıcı</span><span dir="auto">${esc(HOLD)}</span></div>` : ''}
      <div class="py-act">${cpBtn('pri', IBAN, "IBAN'ı kopyala")}${HOLD ? cpBtn('sec', HOLD, 'Adı kopyala') : ''}</div></div></section>`;
  app.innerHTML = `
    <header class="hd"><a class="brand" href="${WA_VORZEN}" target="_blank" rel="noopener" aria-label="Vorzen">${logoTag()}</a>
      <button class="icb" id="theme" aria-label="Görünümü değiştir"><span class="moon">${I(IC.moon)}</span><span class="sun">${I(IC.sun)}</span></button></header>
    <section class="hero${ar ? ' ar' : ''}">${pic(kind)}<div class="tab"><h1 class="nm" dir="auto">${esc(D.name)}</h1></div></section>
    ${D.title ? `<p class="role rv" style="--i:${i++}" dir="auto">${esc(D.title)}</p>` : ''}
    ${D.bio ? `<p class="about rv" style="--i:${i++}" dir="auto"${isAr(D.bio) ? ' lang="ar"' : ''}>${esc(D.bio)}</p>` : ''}
    ${rows ? `<section class="blk rv" style="--i:${i++}"><h2><span class="fbar"></span>İletişim</h2><ul class="rows">${rows}</ul></section>` : ''}
    ${payHTML.replace('__PI__', i++)}
    ${socials ? `<section class="blk rv" style="--i:${i++}"><h2><span class="fbar"></span>Sosyal medya</h2><div class="strip${D.socials.length <= 2 ? ' fill' : ''}">${socials}</div></section>` : ''}
    <footer class="rv" style="--i:${i++}"><span class="l">${logoTag().replace('class="logo"', 'class="logo fl"')}</span><a href="${WA_VORZEN}" target="_blank" rel="noopener">Sen de yaptır ${I(IC.arrow, 1.8)}</a></footer>`;

  const callC = D.contacts.find(c => c.k === 'p'), waC = D.contacts.find(c => c.k === 'w');
  const bar = document.createElement('nav'); bar.className = 'bar'; bar.setAttribute('aria-label', 'Hızlı işlemler');
  bar.innerHTML = `<div class="in">
      ${callC ? `<a class="act ${waC ? 'sec' : 'pri'}" href="${esc(callC.href)}">${I(IC.phone)}<span>Ara</span></a>` : ''}
      ${waC ? `<a class="act pri" href="${esc(waC.href)}" target="_blank" rel="noopener">${waC.icon}<span>WhatsApp</span></a>` : ''}</div>`;
  if (callC || waC) document.body.appendChild(bar); else document.body.style.paddingBottom = '24px';

  const cimg = document.getElementById('cimg');
  if (cimg) cimg.addEventListener('error', () => { document.getElementById('pic').outerHTML = pic('mono'); });
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; }
    catch { const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch {} ta.remove(); return ok; }
  }
  document.querySelectorAll('.cp').forEach(b => b.addEventListener('click', async () => {
    buzz(10); await copyText(b.dataset.c);
    b.classList.add('done'); b.querySelector('.t').textContent = 'Kopyalandı';
    clearTimeout(b._t); b._t = setTimeout(() => { b.classList.remove('done'); b.querySelector('.t').textContent = b.dataset.l; }, 1800);
  }));
  document.getElementById('theme').onclick = () => { buzz(); setTheme(!HTML.classList.contains('dark'), true); };
  document.querySelectorAll('.row,.so,.act').forEach(a => a.addEventListener('click', () => buzz()));

  // ---------- loader: wait for what the page really needs ----------
  const fill = document.getElementById('lfill');
  let prog = 0; const setP = v => { prog = Math.max(prog, v); fill.style.width = prog + '%'; };
  requestAnimationFrame(() => setP(22));
  const img = document.getElementById('cimg');
  const tasks = [
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setP(60)),
    img ? new Promise(r => { if (img.complete) r(); else { img.addEventListener('load', r, { once: true }); img.addEventListener('error', r, { once: true }); } })
            .then(() => img.decode ? img.decode().catch(() => {}) : 0).then(() => setP(92)) : Promise.resolve(),
  ];
  let seen = false; try { seen = sessionStorage.getItem('vz-seen') === '1'; sessionStorage.setItem('vz-seen', '1'); } catch {}
  const minShow = reduce ? 0 : seen ? 450 : 1250;
  Promise.race([Promise.all(tasks), wait(3800)])
    .then(() => wait(Math.max(0, minShow - (performance.now() - T0))))
    .then(() => { setP(100); return wait(reduce ? 0 : 280); })
    .then(reveal);

  function reveal() {
    const L = document.getElementById('loader');
    body.add('gone');
    setTimeout(() => { body.remove('pre'); body.add('shown'); }, reduce ? 0 : 220);
    setTimeout(() => L.remove(), reduce ? 0 : 800);
  }
}
</script>
