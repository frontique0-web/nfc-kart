<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A332E">
<title>Dijital Kartvizit</title>
<link rel="icon" href="../logo.png" type="image/png">
<link rel="apple-touch-icon" href="../logo.png">
<meta property="og:type" content="profile">
<meta property="og:title" content="Dijital Kartvizit">
<meta property="og:description" content="Tüm iletişim bilgilerim tek dokunuşta.">
<meta property="og:image" content="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#07100F;--ink-2:#0B1A18;--surface:#101F1C;--surface-2:#162925;
    --line:rgba(233,226,210,.10);--gold-1:#EBD9AE;--gold-2:#C4A265;--gold-line:rgba(196,162,101,.34);
    --text:#F2EFE8;--muted:rgba(242,239,232,.52);--ok:#86CBA8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:#07100F}
  html,body{min-height:100%}
  body{
    background:radial-gradient(140% 90% at 50% -20%, #1A332E 0%, var(--ink-2) 42%, var(--ink) 100%);
    color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    display:flex;justify-content:center;
    padding:calc(40px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
  }
  main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .fade{opacity:0;transform:translateY(10px);animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes in{to{opacity:1;transform:none}}

  .avatar{
    width:128px;height:128px;border-radius:50%;padding:3px;
    background:linear-gradient(160deg,var(--gold-1),var(--gold-2) 60%,rgba(196,162,101,.35));
    box-shadow:0 18px 50px -18px rgba(0,0,0,.8);margin-bottom:22px;
  }
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--surface)}
  .avatar.logo{border-radius:30px}
  .avatar.logo img{border-radius:27px;object-fit:contain;background:#fff;padding:14px}
  .avatar .init{
    width:100%;height:100%;border-radius:inherit;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:600;color:var(--gold-1)
  }
  h1{font-size:clamp(25px,7vw,30px);font-weight:600;letter-spacing:-.02em;line-height:1.25}
  .title{margin-top:8px;font-size:16px;color:var(--gold-1);font-weight:400}
  .bio{margin-top:12px;font-size:14px;line-height:1.7;color:var(--muted);font-weight:300;max-width:340px}

  .actions{display:flex;gap:10px;width:100%;margin-top:26px}
  .act{
    flex:1;height:52px;border:0;border-radius:14px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
    transition:transform .14s ease,box-shadow .3s ease,color .3s ease;
  }
  .act:active{transform:scale(.97)}
  .act svg{width:19px;height:19px}
  .act.primary{background:linear-gradient(180deg,var(--gold-1),var(--gold-2));color:#0B1A18}
  .act.secondary{flex:0 0 52px;background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
  .act.done{color:var(--ok)}

  .links{width:100%;margin-top:22px;display:flex;flex-direction:column;gap:10px}
  .lk{
    display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;text-decoration:none;color:var(--text);
    background:linear-gradient(160deg,var(--surface-2) 0%,var(--surface) 60%,#0C1917 100%);
    border:1px solid var(--line);text-align:left;transition:transform .14s ease,border-color .3s ease;
  }
  .lk:active{transform:scale(.98)}
  .lk:hover{border-color:var(--gold-line)}
  .ico{flex:0 0 42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(235,217,174,.08);color:var(--gold-1)}
  .ico svg{width:21px;height:21px}
  .txt{flex:1;min-width:0}
  .lbl{font-size:15px;font-weight:600}
  .val{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
  .arr{width:18px;height:18px;color:var(--muted);flex:0 0 18px}

  .brand{
    margin-top:34px;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;
    font-size:12.5px;color:#fff;text-decoration:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)
  }
  .brand svg{width:15px;height:15px}
  .empty{color:var(--muted);font-size:15px;margin-top:40vh}
</style>
</head>
<body>
<main id="app"></main>

const g = k => (q.get(k) || '').trim();
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const name = g('n'), title = g('t'), bio = g('b'), img = g('i'), isLogo = g('s') === 'l';

} else {
  document.title = name + (title ? ' · ' + title : '');

  let delay = 0; const d = () => `style="animation-delay:${(delay += .06).toFixed(2)}s"`;

  let html = `<div class="avatar fade ${isLogo ? 'logo' : ''}" ${d()}>` +
    (imgSrc ? `<img src="${esc(imgSrc)}" alt="${esc(name)}" onerror="this.outerHTML='<div class=init>${esc(initials)}</div>'">`
            : `<div class="init">${esc(initials)}</div>`) + `</div>`;
  html += `<h1 class="fade" ${d()}>${esc(name)}</h1>`;
  if (title) html += `<p class="title fade" ${d()}>${esc(title)}</p>`;
  if (bio) html += `<p class="bio fade" ${d()}>${esc(bio)}</p>`;

  html += `<div class="actions fade" ${d()}>

  </div>`;

  html += `<div class="links">`;
  for (const [k, label, href, val, kind] of DEFS) {
    const v = g(k); if (!v) continue;
    const icon = kind === 'fill' ? svgFill(ICONS[k]) : svgLine(LINE[k]);
    const ext = /^https?:/.test(href(v)) ? ' target="_blank" rel="noopener"' : '';
    html += `<a class="lk fade" ${d()} href="${esc(href(v))}"${ext}>
      <span class="ico">${icon}</span>
      <span class="txt"><span class="lbl">${label}</span><span class="val" style="display:block">${esc(val(v))}</span></span>
      <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </a>`;
  }
  html += `</div>`;

  html += `<a class="brand fade" ${d()} href="https://wa.me/905064678440?text=${encodeURIComponent('Merhaba, NFC dijital kartvizit yaptırmak istiyorum.')}" target="_blank" rel="noopener">${svgFill(ICONS.w)}<span>Sen de dijital kartvizit yaptır · Vorzen</span></a>`;
  app.innerHTML = html;

  // Rehbere kaydet (vCard)
  const vesc = s => s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
  async function photoB64() {
    if (!imgSrc) return '';
    try {
      const r = await fetch(imgSrc); if (!r.ok) return '';
      const b = await r.blob();
      return await new Promise(res => { const f = new FileReader(); f.onload = () => res(String(f.result).split(',')[1] || ''); f.readAsDataURL(b); });
    } catch { return ''; }
  }
  document.getElementById('save').onclick = async (ev) => {
    const btn = ev.currentTarget;
    const L = ['BEGIN:VCARD', 'VERSION:3.0', 'N:' + vesc(name) + ';;;;', 'FN:' + vesc(name)];
    if (title) L.push('TITLE:' + vesc(title));
    if (g('p')) L.push('TEL;TYPE=CELL:+' + digits(g('p')));
    if (g('w') && digits(g('w')) !== digits(g('p'))) L.push('TEL;TYPE=WhatsApp:+' + digits(g('w')));
    if (g('e')) L.push('EMAIL:' + g('e'));
    if (g('web')) L.push('URL:' + (isUrl(g('web')) ? g('web') : 'https://' + g('web')));
    if (g('ig')) L.push('X-SOCIALPROFILE;TYPE=instagram:' + prof('https://instagram.com/', g('ig')));
    L.push('URL;TYPE=Kartvizit:' + location.href);
    const ph = await photoB64();
    if (ph) L.push('PHOTO;ENCODING=b;TYPE=' + (/\.png$/i.test(imgSrc) ? 'PNG' : 'JPEG') + ':' + ph);
    L.push('END:VCARD');
    const blob = new Blob([L.join('\r\n')], { type: 'text/vcard;charset=utf-8' });
    const file = name.replace(/[^\p{L}\p{N} ]/gu, '').trim().replace(/\s+/g, '_') || 'kartvizit';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file + '.vcf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    btn.classList.add('done'); btn.querySelector('span').textContent = 'Kaydedildi';
    setTimeout(() => { btn.classList.remove('done'); btn.querySelector('span').textContent = 'Rehbere Kaydet'; }, 2500);
  };

  document.getElementById('share').onclick = async () => {
    const data = { title: name, text: name + (title ? ' · ' + title : ''), url: location.href };
    try {
      if (navigator.share) await navigator.share(data);
      else { await navigator.clipboard.writeText(location.href); alertless(); }
    } catch {}
  };
  function alertless() {
    const b = document.getElementById('share'); b.classList.add('done');
    setTimeout(() => b.classList.remove('done'), 1800);
  }
}
</script>
